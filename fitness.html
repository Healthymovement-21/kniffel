<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Fitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#02060C;
    --bg-1:#050D16;
    --panel:rgba(8,22,34,0.66);
    --panel-solid:#071722;
    --line:rgba(64,224,255,0.22);
    --line-strong:rgba(64,224,255,0.5);
    --cyan:#3FE0FF;
    --cyan-soft:#8FF1FF;
    --cyan-dim:#1B7A8C;
    --amber:#FFB13C;
    --danger:#FF4666;
    --good:#3FFFB0;
    --text:#D8F3FF;
    --text-dim:#5C859C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(63,224,255,0.14) 0%, transparent 60%),
      repeating-linear-gradient(0deg, rgba(63,224,255,0.05) 0px, rgba(63,224,255,0.05) 1px, transparent 1px, transparent 34px),
      repeating-linear-gradient(90deg, rgba(63,224,255,0.05) 0px, rgba(63,224,255,0.05) 1px, transparent 1px, transparent 34px),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
    min-height:100vh;
    font-family:'Rajdhani', sans-serif;
    color:var(--text);
    padding:20px 14px 60px;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }
  .scanline{
    position:fixed; left:0; right:0; height:2px; pointer-events:none; z-index:50;
    background:linear-gradient(90deg, transparent, rgba(63,224,255,0.55), transparent);
    box-shadow:0 0 12px rgba(63,224,255,0.6);
    animation:scan 5s linear infinite;
    opacity:0.6;
  }
  @keyframes scan{
    0%{top:-2px;}
    100%{top:100vh;}
  }
  .wrap{max-width:640px;margin:0 auto; position:relative;}

  /* ---------- Nav ---------- */
  .site-nav{display:flex; gap:8px; justify-content:center; margin-bottom:18px;}
  .site-nav a{
    font-family:'IBM Plex Mono'; color:var(--text-dim); opacity:0.85; font-size:11.5px; text-decoration:none;
    letter-spacing:1px; text-transform:uppercase;
    padding:7px 14px; border:1px solid rgba(63,224,255,0.18); background:rgba(63,224,255,0.03);
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  }
  .site-nav a.active{opacity:1; border-color:var(--line-strong); color:var(--cyan); box-shadow:0 0 14px rgba(63,224,255,0.25) inset;}

  /* ---------- Header ---------- */
  header{text-align:center; margin-bottom:22px; position:relative;}
  .status-line{
    display:flex; align-items:center; justify-content:center; gap:7px;
    font-family:'IBM Plex Mono'; font-size:10.5px; letter-spacing:3px; text-transform:uppercase;
    color:var(--good); margin-bottom:10px;
  }
  .status-line .dot{
    width:6px; height:6px; border-radius:50%; background:var(--good);
    box-shadow:0 0 8px var(--good); animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  .cup{width:50px;height:50px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;
    filter:drop-shadow(0 0 10px rgba(63,224,255,0.55));}
  h1{
    font-family:'Orbitron', sans-serif; font-weight:900; font-size:38px; letter-spacing:6px;
    margin:0; color:var(--cyan-soft); text-transform:uppercase;
    text-shadow:0 0 18px rgba(63,224,255,0.65), 0 0 2px rgba(255,255,255,0.4);
  }
  .subtitle{
    font-family:'IBM Plex Mono'; font-size:10.5px; letter-spacing:3.5px; text-transform:uppercase;
    color:var(--text-dim); margin-top:6px;
  }

  /* ---------- Section tabs ---------- */
  .tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:16px;}
  .tab{
    flex:1 0 auto; background:rgba(63,224,255,0.03); border:1px solid rgba(63,224,255,0.14);
    border-bottom:2px solid transparent; padding:11px 12px; text-align:center; cursor:pointer;
  }
  .tab.active{background:rgba(63,224,255,0.08); border-bottom-color:var(--cyan); box-shadow:0 12px 16px -12px rgba(63,224,255,0.5);}
  .tab .tname{
    font-family:'IBM Plex Mono'; font-weight:600; font-size:11px; letter-spacing:1.2px; text-transform:uppercase;
    color:var(--text-dim);
  }
  .tab.active .tname{color:var(--cyan-soft); text-shadow:0 0 8px rgba(63,224,255,0.5);}

  /* ---------- Cards / forms ---------- */
  .card{
    background:var(--panel); color:var(--text);
    border:1px solid var(--line); position:relative;
    padding:20px 20px 22px; margin-bottom:16px;
    backdrop-filter:blur(6px);
    clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
    box-shadow:0 0 0 1px rgba(0,0,0,0.3), 0 18px 30px rgba(0,0,0,0.45);
  }
  .card::before{
    content:''; position:absolute; top:0; left:0; width:28px; height:28px;
    border-top:2px solid var(--cyan); border-left:2px solid var(--cyan);
    opacity:0.8; pointer-events:none;
  }
  .card::after{
    content:''; position:absolute; bottom:0; right:0; width:28px; height:28px;
    border-bottom:2px solid var(--cyan); border-right:2px solid var(--cyan);
    opacity:0.8; pointer-events:none;
  }
  .card h2{
    font-family:'Orbitron', sans-serif; font-weight:700; font-size:13px; letter-spacing:2.5px;
    text-transform:uppercase; color:var(--cyan-soft); margin:0 0 14px;
    text-shadow:0 0 10px rgba(63,224,255,0.35);
  }
  .card p.lead{font-size:14px; color:var(--text-dim); margin:0 0 14px; line-height:1.5;}
  .field-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field.full{grid-column:1 / -1;}
  .field label{
    font-family:'IBM Plex Mono'; font-size:10px; color:var(--text-dim); font-weight:600;
    text-transform:uppercase; letter-spacing:1px;
  }
  .field input, .field select{
    padding:10px 12px; border-radius:2px; border:1px solid rgba(63,224,255,0.25);
    background:rgba(2,10,16,0.7); font-family:'Rajdhani'; font-weight:600; font-size:15px; color:var(--text);
  }
  .field input::placeholder{color:rgba(216,243,255,0.28);}
  .field input:focus, .field select:focus{
    outline:none; border-color:var(--cyan); box-shadow:0 0 0 2px rgba(63,224,255,0.18);
  }
  .field select{color-scheme:dark;}
  .primary-btn{
    width:100%; margin-top:4px; padding:13px; border:1px solid var(--cyan);
    background:rgba(63,224,255,0.08); color:var(--cyan-soft); font-family:'Orbitron', sans-serif; font-weight:700;
    font-size:12.5px; letter-spacing:2px; text-transform:uppercase; cursor:pointer;
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    transition:background 0.15s ease, box-shadow 0.15s ease;
  }
  .primary-btn:hover{background:rgba(63,224,255,0.18); box-shadow:0 0 20px rgba(63,224,255,0.3);}
  .primary-btn:disabled{border-color:rgba(92,133,156,0.3); color:var(--text-dim); background:none; cursor:not-allowed;}

  /* ---------- Stat tiles ---------- */
  .stat-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:4px;}
  .stat-tile{
    flex:1 1 120px; background:rgba(2,10,16,0.55); border:1px solid rgba(63,224,255,0.18);
    padding:13px 15px;
  }
  .stat-tile .val{font-family:'IBM Plex Mono'; font-size:22px; font-weight:600; color:var(--cyan-soft); text-shadow:0 0 10px rgba(63,224,255,0.35);}
  .stat-tile .lbl{font-family:'IBM Plex Mono'; font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; margin-top:3px;}
  .stat-tile .delta{font-size:12px; font-family:'IBM Plex Mono'; margin-top:4px;}
  .delta.up{color:var(--danger);}
  .delta.down{color:var(--good);}

  /* ---------- History list ---------- */
  .hist-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:11px 2px; border-bottom:1px dashed rgba(63,224,255,0.18); font-size:13.5px;
  }
  .hist-row:last-child{border-bottom:none;}
  .hist-main{flex:1;}
  .hist-date{font-family:'IBM Plex Mono'; font-size:11px; color:var(--text-dim); display:block; margin-bottom:2px; letter-spacing:0.5px;}
  .hist-detail{color:var(--text-dim); font-size:12.5px;}
  .hist-val{font-family:'IBM Plex Mono'; font-weight:700; color:var(--cyan-soft); white-space:nowrap;}
  .del-btn{
    background:none; border:1px solid rgba(255,70,102,0.35); color:var(--text-dim);
    width:26px; height:26px; font-size:12px; cursor:pointer; line-height:1; flex-shrink:0;
  }
  .del-btn:hover{border-color:var(--danger); color:var(--danger); box-shadow:0 0 10px rgba(255,70,102,0.35);}
  .empty-hint{font-family:'IBM Plex Mono'; font-size:12px; color:var(--text-dim); font-style:italic; padding:6px 2px;}

  /* ---------- Chart ---------- */
  .chart-wrap{overflow-x:auto;}
  .bar-row{display:flex; align-items:center; gap:8px; margin-bottom:9px; font-size:12px;}
  .bar-label{width:100px; flex-shrink:0; color:var(--text-dim); font-family:'IBM Plex Mono'; font-size:10.5px; text-transform:uppercase; letter-spacing:0.5px;}
  .bar-track{flex:1; background:rgba(63,224,255,0.08); height:14px; overflow:hidden; border:1px solid rgba(63,224,255,0.12);}
  .bar-fill{background:linear-gradient(90deg, var(--cyan-dim), var(--cyan)); height:100%; box-shadow:0 0 8px rgba(63,224,255,0.5);}
  .bar-val{width:56px; text-align:right; font-family:'IBM Plex Mono'; font-size:11.5px; color:var(--text-dim); flex-shrink:0;}

  /* ---------- Gauge ---------- */
  .gauge-row{display:flex; justify-content:center; margin-bottom:10px;}
  .gauge{
    --pct:0; --gcolor:#3FE0FF;
    width:128px; height:128px; border-radius:50%;
    background:conic-gradient(var(--gcolor) calc(var(--pct)*3.6deg), rgba(63,224,255,0.08) 0deg);
    display:flex; align-items:center; justify-content:center;
    filter:drop-shadow(0 0 12px var(--gcolor));
  }
  .gauge-inner{
    width:100px; height:100px; border-radius:50%; background:var(--panel-solid);
    border:1px solid rgba(63,224,255,0.25);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .gauge-inner .num{font-family:'IBM Plex Mono'; font-size:24px; font-weight:600; color:var(--text);}
  .gauge-inner .lbl{font-family:'IBM Plex Mono'; font-size:9px; letter-spacing:1px; color:var(--text-dim); text-transform:uppercase; margin-top:3px;}
  .bmi-badge{
    display:block; text-align:center; margin-top:10px;
    font-family:'IBM Plex Mono'; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; font-weight:700;
    color:var(--good);
  }
  .bmi-badge.warn{color:var(--amber);}

  @media (max-width:400px){
    h1{font-size:28px; letter-spacing:4px;}
    .field-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="scanline"></div>
<div class="wrap">
  <div class="site-nav">
    <a href="index.html">🎲 Kniffel</a>
    <a href="fitness.html" class="active">💪 Fitness</a>
  </div>
  <header>
    <div class="status-line"><span class="dot"></span>System Online</div>
    <div class="cup">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none">
        <rect x="4" y="20" width="6" height="8" rx="1" fill="rgba(63,224,255,0.08)" stroke="#3FE0FF" stroke-width="1.4"/>
        <rect x="10" y="16" width="4" height="16" rx="1" fill="rgba(63,224,255,0.08)" stroke="#3FE0FF" stroke-width="1.4"/>
        <rect x="34" y="16" width="4" height="16" rx="1" fill="rgba(63,224,255,0.08)" stroke="#3FE0FF" stroke-width="1.4"/>
        <rect x="38" y="20" width="6" height="8" rx="1" fill="rgba(63,224,255,0.08)" stroke="#3FE0FF" stroke-width="1.4"/>
        <rect x="14" y="22" width="20" height="4" rx="1" fill="rgba(63,224,255,0.08)" stroke="#3FE0FF" stroke-width="1.4"/>
      </svg>
    </div>
    <h1>Fitness</h1>
    <div class="subtitle">Körper &middot; Diagnostik &middot; Interface</div>
  </header>

  <div id="app"></div>
</div>

<script>
const STORAGE_KEY = 'fitness-tracker-v1';
const ACTIVITY_TYPES = ['Laufen','Radfahren','Krafttraining','Schwimmen','Yoga','Wandern','Sonstiges'];

let state = null;

function todayISO(){ return new Date().toISOString().slice(0,10); }

function freshState(){
  return {
    activeTab:'profil',
    heightCm:null,
    measurements:[],
    activities:[],
    draftMeasurement:{date:todayISO(), weight:'', waist:'', chest:'', hip:'', biceps:'', thigh:'', bodyFat:''},
    draftActivity:{date:todayISO(), type:ACTIVITY_TYPES[0], duration:'', calories:'', note:''},
  };
}

function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ console.warn('save failed', e); }
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ state = {...freshState(), ...JSON.parse(raw)}; return; }
  }catch(e){ /* no saved data */ }
  state = freshState();
}

/* ---------------- helpers ---------------- */
function escapeHtml(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function sortedMeasurements(){
  return [...state.measurements].sort((a,b)=> a.date.localeCompare(b.date));
}
function sortedActivities(){
  return [...state.activities].sort((a,b)=> b.date.localeCompare(a.date));
}
function daysAgo(n){
  const d = new Date();
  d.setDate(d.getDate()-n);
  return d.toISOString().slice(0,10);
}
function bmiCategory(bmi){
  if(bmi<18.5) return {label:'Untergewicht', warn:true, color:'#FFB13C'};
  if(bmi<25) return {label:'Normalgewicht', warn:false, color:'#3FFFB0'};
  if(bmi<30) return {label:'Übergewicht', warn:true, color:'#FFB13C'};
  return {label:'Adipositas', warn:true, color:'#FF4666'};
}
function bmiGaugeHTML(bmi){
  const cat = bmiCategory(bmi);
  const pct = Math.max(0, Math.min(100, (bmi/40)*100));
  return `
    <div class="gauge-row">
      <div class="gauge" style="--pct:${pct.toFixed(1)}; --gcolor:${cat.color}">
        <div class="gauge-inner">
          <div class="num">${bmi.toFixed(1)}</div>
          <div class="lbl">BMI</div>
        </div>
      </div>
    </div>
    <div class="bmi-badge ${cat.warn?'warn':''}">${cat.label}</div>
  `;
}

/* ---------------- actions ---------------- */
function setTab(t){ state.activeTab=t; saveState(); render(); }

function setHeight(v){
  const n = parseFloat(v);
  state.heightCm = isFinite(n) && n>0 ? n : null;
  saveState(); render();
}

function addMeasurement(){
  const d = state.draftMeasurement;
  const weight = parseFloat(d.weight);
  if(!d.date || !isFinite(weight) || weight<=0) return;
  const entry = {
    id:'m'+Date.now()+Math.random().toString(36).slice(2,6),
    date:d.date, weight,
    waist: d.waist!=='' ? parseFloat(d.waist) : null,
    chest: d.chest!=='' ? parseFloat(d.chest) : null,
    hip: d.hip!=='' ? parseFloat(d.hip) : null,
    biceps: d.biceps!=='' ? parseFloat(d.biceps) : null,
    thigh: d.thigh!=='' ? parseFloat(d.thigh) : null,
    bodyFat: d.bodyFat!=='' ? parseFloat(d.bodyFat) : null,
  };
  state.measurements.push(entry);
  state.draftMeasurement = {date:todayISO(), weight:'', waist:'', chest:'', hip:'', biceps:'', thigh:'', bodyFat:''};
  saveState(); render();
}
function removeMeasurement(id){
  state.measurements = state.measurements.filter(m=>m.id!==id);
  saveState(); render();
}

function addActivity(){
  const d = state.draftActivity;
  const duration = parseInt(d.duration, 10);
  if(!d.date || !d.type || !isFinite(duration) || duration<=0) return;
  const entry = {
    id:'a'+Date.now()+Math.random().toString(36).slice(2,6),
    date:d.date, type:d.type, duration,
    calories: d.calories!=='' ? parseInt(d.calories,10) : null,
    note: d.note || '',
  };
  state.activities.push(entry);
  state.draftActivity = {date:todayISO(), type:ACTIVITY_TYPES[0], duration:'', calories:'', note:''};
  saveState(); render();
}
function removeActivity(id){
  state.activities = state.activities.filter(a=>a.id!==id);
  saveState(); render();
}

/* ---------------- render: tabs ---------------- */
function renderTabBar(){
  const tabs = [['profil','Profil & Maße'], ['aktivitaeten','Aktivitäten'], ['statistik','Statistik']];
  return `<div class="tabs">${tabs.map(([key,label])=>`
    <div class="tab ${state.activeTab===key?'active':''}" onclick="setTab('${key}')">
      <div class="tname">${label}</div>
    </div>`).join('')}</div>`;
}

/* ---------------- render: profil ---------------- */
function renderProfil(){
  const ms = sortedMeasurements();
  const latest = ms[ms.length-1];
  const prev = ms[ms.length-2];
  const d = state.draftMeasurement;

  let statsHTML = '';
  if(latest){
    const delta = prev ? (latest.weight - prev.weight) : null;
    const deltaHTML = delta!=null
      ? `<div class="delta ${delta>0?'up':delta<0?'down':''}">${delta>0?'+':''}${delta.toFixed(1)} kg</div>`
      : '';
    let bmiTile = '';
    if(state.heightCm){
      const bmi = latest.weight / Math.pow(state.heightCm/100, 2);
      bmiTile = `<div class="stat-tile">${bmiGaugeHTML(bmi)}</div>`;
    }
    statsHTML = `<div class="stat-row">
      <div class="stat-tile">
        <div class="val">${latest.weight} kg</div>
        <div class="lbl">Aktuelles Gewicht</div>
        ${deltaHTML}
      </div>
      ${bmiTile}
    </div>`;
  }

  const historyHTML = ms.length ? [...ms].reverse().map(m=>{
    const parts=[];
    if(m.waist!=null) parts.push('Taille '+m.waist+' cm');
    if(m.chest!=null) parts.push('Brust '+m.chest+' cm');
    if(m.hip!=null) parts.push('Hüfte '+m.hip+' cm');
    if(m.biceps!=null) parts.push('Bizeps '+m.biceps+' cm');
    if(m.thigh!=null) parts.push('Oberschenkel '+m.thigh+' cm');
    if(m.bodyFat!=null) parts.push('KFA '+m.bodyFat+' %');
    return `<div class="hist-row">
      <div class="hist-main">
        <span class="hist-date">${fmtDate(m.date)}</span>
        ${parts.length ? `<span class="hist-detail">${escapeHtml(parts.join(' · '))}</span>` : ''}
      </div>
      <span class="hist-val">${m.weight} kg</span>
      <button class="del-btn" onclick="removeMeasurement('${m.id}')">✕</button>
    </div>`;
  }).join('') : `<div class="empty-hint">Noch keine Messungen erfasst.</div>`;

  return `
    <div class="card">
      <h2>Körpergröße</h2>
      <div class="field-grid">
        <div class="field full">
          <label>Größe (cm)</label>
          <input type="number" min="0" step="0.1" placeholder="z. B. 178" value="${state.heightCm ?? ''}"
            onchange="setHeight(this.value)">
        </div>
      </div>
    </div>

    ${statsHTML ? `<div class="card">${statsHTML}</div>` : ''}

    <div class="card">
      <h2>Neue Messung</h2>
      <p class="lead">Trag deine aktuellen Maße ein — nur das Gewicht ist Pflicht, der Rest ist optional.</p>
      <div class="field-grid">
        <div class="field">
          <label>Datum</label>
          <input type="date" value="${d.date}" oninput="state.draftMeasurement.date=this.value">
        </div>
        <div class="field">
          <label>Gewicht (kg)</label>
          <input type="number" min="0" step="0.1" placeholder="z. B. 74.5" value="${d.weight}" oninput="state.draftMeasurement.weight=this.value">
        </div>
        <div class="field">
          <label>Taille (cm)</label>
          <input type="number" min="0" step="0.1" value="${d.waist}" oninput="state.draftMeasurement.waist=this.value">
        </div>
        <div class="field">
          <label>Brust (cm)</label>
          <input type="number" min="0" step="0.1" value="${d.chest}" oninput="state.draftMeasurement.chest=this.value">
        </div>
        <div class="field">
          <label>Hüfte (cm)</label>
          <input type="number" min="0" step="0.1" value="${d.hip}" oninput="state.draftMeasurement.hip=this.value">
        </div>
        <div class="field">
          <label>Bizeps (cm)</label>
          <input type="number" min="0" step="0.1" value="${d.biceps}" oninput="state.draftMeasurement.biceps=this.value">
        </div>
        <div class="field">
          <label>Oberschenkel (cm)</label>
          <input type="number" min="0" step="0.1" value="${d.thigh}" oninput="state.draftMeasurement.thigh=this.value">
        </div>
        <div class="field">
          <label>Körperfett (%)</label>
          <input type="number" min="0" step="0.1" value="${d.bodyFat}" oninput="state.draftMeasurement.bodyFat=this.value">
        </div>
      </div>
      <button class="primary-btn" onclick="addMeasurement()">Messung speichern</button>
    </div>

    <div class="card">
      <h2>Verlauf</h2>
      ${historyHTML}
    </div>
  `;
}

/* ---------------- render: aktivitaeten ---------------- */
function renderAktivitaeten(){
  const d = state.draftActivity;
  const acts = sortedActivities();

  const weekStart = daysAgo(7);
  const thisWeek = acts.filter(a=>a.date>=weekStart);
  const weekMinutes = thisWeek.reduce((s,a)=>s+a.duration,0);

  const summaryHTML = `<div class="stat-row">
    <div class="stat-tile">
      <div class="val">${thisWeek.length}</div>
      <div class="lbl">Einheiten (7 Tage)</div>
    </div>
    <div class="stat-tile">
      <div class="val">${weekMinutes}</div>
      <div class="lbl">Minuten (7 Tage)</div>
    </div>
  </div>`;

  const historyHTML = acts.length ? acts.map(a=>{
    const bits=[a.duration+' min'];
    if(a.calories!=null) bits.push(a.calories+' kcal');
    return `<div class="hist-row">
      <div class="hist-main">
        <span class="hist-date">${fmtDate(a.date)} · ${escapeHtml(a.type)}</span>
        ${a.note ? `<span class="hist-detail">${escapeHtml(a.note)}</span>` : ''}
      </div>
      <span class="hist-val">${bits.join(' · ')}</span>
      <button class="del-btn" onclick="removeActivity('${a.id}')">✕</button>
    </div>`;
  }).join('') : `<div class="empty-hint">Noch keine Aktivitäten erfasst.</div>`;

  return `
    <div class="card">${summaryHTML}</div>

    <div class="card">
      <h2>Neue Aktivität</h2>
      <div class="field-grid">
        <div class="field">
          <label>Datum</label>
          <input type="date" value="${d.date}" oninput="state.draftActivity.date=this.value">
        </div>
        <div class="field">
          <label>Art</label>
          <select onchange="state.draftActivity.type=this.value">
            ${ACTIVITY_TYPES.map(t=>`<option value="${t}" ${d.type===t?'selected':''}>${t}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Dauer (min)</label>
          <input type="number" min="0" placeholder="z. B. 45" value="${d.duration}" oninput="state.draftActivity.duration=this.value">
        </div>
        <div class="field">
          <label>Kalorien (optional)</label>
          <input type="number" min="0" value="${d.calories}" oninput="state.draftActivity.calories=this.value">
        </div>
        <div class="field full">
          <label>Notiz (optional)</label>
          <input type="text" placeholder="z. B. Intervalltraining" value="${escapeHtml(d.note)}" oninput="state.draftActivity.note=this.value">
        </div>
      </div>
      <button class="primary-btn" onclick="addActivity()">Aktivität speichern</button>
    </div>

    <div class="card">
      <h2>Verlauf</h2>
      ${historyHTML}
    </div>
  `;
}

/* ---------------- render: statistik ---------------- */
function weightChartSVG(){
  const pts = sortedMeasurements().filter(m=>m.weight!=null);
  if(pts.length<2){
    return `<div class="empty-hint">Mindestens zwei Messungen nötig, um einen Verlauf zu zeichnen.</div>`;
  }
  const w=560, h=140, padX=10, padY=16;
  const weights = pts.map(p=>p.weight);
  const min = Math.min(...weights), max = Math.max(...weights);
  const span = (max-min) || 1;
  const stepX = (w - padX*2) / (pts.length-1);
  const xy = pts.map((p,i)=>{
    const x = padX + i*stepX;
    const y = padY + (h - padY*2) * (1 - (p.weight-min)/span);
    return [x,y];
  });
  const linePts = xy.map(([x,y])=>`${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
  const dots = xy.map(([x,y])=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="#02060C" stroke="#3FE0FF" stroke-width="2"/>`).join('');
  const gridLines = [0,0.25,0.5,0.75,1].map(f=>{
    const y = padY + (h-padY*2)*f;
    return `<line x1="${padX}" y1="${y.toFixed(1)}" x2="${w-padX}" y2="${y.toFixed(1)}" stroke="rgba(63,224,255,0.12)" stroke-width="1"/>`;
  }).join('');
  return `
    <div class="chart-wrap">
      <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
        ${gridLines}
        <polyline points="${linePts}" fill="none" stroke="#3FE0FF" stroke-width="2.5" style="filter:drop-shadow(0 0 6px rgba(63,224,255,0.7))"/>
        ${dots}
      </svg>
    </div>
    <div class="stat-row">
      <div class="stat-tile"><div class="val">${min} kg</div><div class="lbl">Minimum</div></div>
      <div class="stat-tile"><div class="val">${max} kg</div><div class="lbl">Maximum</div></div>
    </div>
  `;
}

function activityBarsHTML(){
  const since = daysAgo(30);
  const recent = state.activities.filter(a=>a.date>=since);
  if(!recent.length){
    return `<div class="empty-hint">Keine Aktivitäten in den letzten 30 Tagen.</div>`;
  }
  const byType = {};
  recent.forEach(a=>{ byType[a.type] = (byType[a.type]||0) + a.duration; });
  const max = Math.max(...Object.values(byType));
  return Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([type,mins])=>`
    <div class="bar-row">
      <div class="bar-label">${escapeHtml(type)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(mins/max*100).toFixed(0)}%"></div></div>
      <div class="bar-val">${mins} min</div>
    </div>
  `).join('');
}

function currentStreak(){
  const days = new Set(state.activities.map(a=>a.date));
  let d = new Date();
  if(!days.has(d.toISOString().slice(0,10))){
    d.setDate(d.getDate()-1);
  }
  let streak = 0;
  while(days.has(d.toISOString().slice(0,10))){
    streak++;
    d.setDate(d.getDate()-1);
  }
  return streak;
}

function renderStatistik(){
  const ms = sortedMeasurements();
  const latest = ms[ms.length-1];
  const streak = currentStreak();

  let bmiCard = '';
  if(latest && state.heightCm){
    const bmi = latest.weight / Math.pow(state.heightCm/100, 2);
    bmiCard = `<div class="card">
      <h2>BMI</h2>
      ${bmiGaugeHTML(bmi)}
    </div>`;
  } else {
    bmiCard = `<div class="card"><h2>BMI</h2><div class="empty-hint">Größe und mindestens eine Gewichtsmessung nötig.</div></div>`;
  }

  return `
    ${bmiCard}
    <div class="card">
      <h2>Gewichtsverlauf</h2>
      ${weightChartSVG()}
    </div>
    <div class="card">
      <h2>Aktivität nach Art (30 Tage)</h2>
      ${activityBarsHTML()}
    </div>
    <div class="card">
      <div class="stat-row">
        <div class="stat-tile">
          <div class="val">${streak}</div>
          <div class="lbl">Tage-Streak</div>
        </div>
        <div class="stat-tile">
          <div class="val">${state.activities.length}</div>
          <div class="lbl">Aktivitäten gesamt</div>
        </div>
      </div>
    </div>
  `;
}

/* ---------------- render ---------------- */
function render(){
  const app = document.getElementById('app');
  let body = '';
  if(state.activeTab==='profil') body = renderProfil();
  else if(state.activeTab==='aktivitaeten') body = renderAktivitaeten();
  else body = renderStatistik();
  app.innerHTML = renderTabBar() + body;
}

(function init(){
  loadState();
  render();
})();
</script>
</body>
</html>
